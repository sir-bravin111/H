    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;

        /* ---------- AI POWER BACKGROUND (glowing network + particles) ---------- */
        #ai-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(circle at 30% 40%, #0d0b1a, #04040a);
            background-image: 
                /* glowing grid lines */
                linear-gradient(rgba(139, 92, 246, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(139, 92, 246, 0.08) 1px, transparent 1px),
                /* core AI glow */
                radial-gradient(circle at 70% 80%, #3b82f622 0%, transparent 45%),
                radial-gradient(circle at 20% 20%, #8b5cf633 0%, transparent 50%),
                /* tech noise */
                repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 2px, transparent 2px, transparent 8px);
            background-size: 40px 40px, 40px 40px, 100% 100%, 100% 100%, 100% 100%;
            pointer-events: none;
        }

        /* floating AI "circuit" orbs */
        #ai-bg::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, #8b5cf622 0%, transparent 70%);
            top: -10%;
            left: -10%;
            animation: orbFloat 20s linear infinite alternate;
            filter: blur(40px);
        }
        #ai-bg::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, #3b82f633 0%, transparent 70%);
            bottom: -10%;
            right: -10%;
            animation: orbFloat 25s linear infinite alternate-reverse;
            filter: blur(50px);
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(60px, 40px) scale(1.3); }
        }

        /* neural network particles (canvas) */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.7;
        }

        /* container with glassmorphism + glow */
        .container {
            position: relative;
            z-index: 10;
            padding: 40px 35px;
            max-width: 700px;
            width: 100%;
            border: 1px solid rgba(139, 92, 246, 0.25);
            border-radius: 28px;
            background: rgba(10, 10, 18, 0.70);
            backdrop-filter: blur(18px);
            box-shadow: 0 0 70px rgba(139, 92, 246, 0.25), inset 0 0 60px rgba(59, 130, 246, 0.05);
            animation: float 3s ease-in-out infinite;
            transition: all 0.2s;
        }

        /* glowing text with AI vibe */
        h1 {
            font-size: 2.9rem;
            margin-bottom: 4px;
            background: linear-gradient(90deg, #a78bfa, #60a5fa, #f472b6, #a78bfa);
            background-size: 300% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 6s ease infinite, floatText 2s ease-in-out infinite;
            letter-spacing: -0.5px;
            text-shadow: 0 0 40px rgba(139, 92, 246, 0.3);
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes floatText { 0%, 100% { text-shadow: 0 0 20px rgba(139, 92, 246, 0.5); } 50% { text-shadow: 0 0 50px rgba(59, 130, 246, 0.8); } }

        .subhead {

            margin-bottom: 22px;
            font-size: 1.1rem;
            letter-spacing: 1px;
            font-weight: 300;
        }
        .subhead b { color: #a78bfa; font-weight: 600; }

        .links a { display: inline-block; margin: 8px; text-decoration: none; }
        .github-btn img { height: 40px; transition: transform 0.3s; filter: drop-shadow(0 0 6px #8b5cf655); }
        .github-btn img:hover { transform: scale(1.12); filter: drop-shadow(0 0 16px #8b5cf6aa); }

        /* BEAT PLAYER BUTTON - cyber style */
        .audio-control {
            margin: 18px 0 12px;
            padding: 12px 32px;
            border: 1px solid #8b5cf6;
            border-radius: 60px;
            background: linear-gradient(90deg, #8b5cf6cc, #3b82f6cc);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: inline-block;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.25);
            backdrop-filter: blur(4px);
            letter-spacing: 0.5px;
        }
        .audio-control:hover { 
            transform: scale(1.06); 
            box-shadow: 0 0 50px rgba(139, 92, 246, 0.6); 
            background: linear-gradient(90deg, #a78bfa, #60a5fa);
        }

        /* CONTACT SECTION – AI CONDUCT */
        .contact-section {
            margin-top: 30px;
            padding-top: 24px;
            border-top: 1px solid rgba(139, 92, 246, 0.2);
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .contact-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 16px;
        }

        .contact-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #12121e;
            padding: 12px 28px;
            border-radius: 60px;
            border: 1px solid #2f2a44;
            color: #fff;
            font-weight: 600;
            text-decoration: none;
            transition: 0.25s;
            font-size: 1rem;
            letter-spacing: 0.4px;
            box-shadow: 0 0 15px rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
        }
        .contact-btn i { font-size: 1.4rem; line-height: 1; }
        .contact-btn.whatsapp { background: #075e54; border-color: #128C7E; }
        .contact-btn.whatsapp:hover { background: #128C7E; transform: scale(1.05); box-shadow: 0 0 30px #075e54aa; }
        .contact-btn.telegram { background: #1f2c3b; border-color: #2f7bb3; }
        .contact-btn.telegram:hover { background: #2f7bb3; transform: scale(1.05); box-shadow: 0 0 30px #2f7bb3aa; }
        .contact-btn.email { background: #1e1e2a; border-color: #5b5b77; }
        .contact-btn.email:hover { background: #3a3a52; transform: scale(1.05); box-shadow: 0 0 30px #88888866; }

        .conduct-badge {

            border: 1px solid #8b5cf666;
            border-radius: 60px;
            padding: 8px 24px;
            font-size: 0.9rem;
            color: #d4c4e4;
            display: inline-flex;

        }
        .conduct-badge span { color: #a78bfa; font-weight: 700; letter-spacing: 0.5px; }

        .footnote {

        @media (max-width: 550px) {

            .contact-btn { width: 100%; justify-content: center; }
            .conduct-badge { font-size: 0.8rem; padding: 6px 16px; }
        }

<body>

<script>
// ---------- NEURAL NETWORK PARTICLES (enhanced) ----------
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];
const PARTICLE_COUNT = 150;

for(let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2.8 + 0.8,
        speedX: (Math.random() * 0.7 - 0.35),
        speedY: (Math.random() * 0.7 - 0.35),
        opacity: Math.random() * 0.7 + 0.3,
        color: `hsl(${260 + Math.random() * 40}, 70%, 60%)` // purple/blue range
    });
}

// connection lines
function drawConnections() {
    for(let i = 0; i < particles.length; i++) {
        for(let j = i+1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const distance = Math.sqrt(dx*dx + dy*dy);
            if(distance < 130) {
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                const alpha = (1 - distance/130) * 0.25;
                ctx.strokeStyle = `rgba(139, 92, 246, ${alpha})`;
                ctx.lineWidth = 0.7;
                ctx.stroke();
            }
        }
    }
}

function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // update and draw particles
    particles.forEach(p => {
        p.x += p.speedX;
        p.y += p.speedY;
        if(p.x < 0 || p.x > canvas.width) p.speedX *= -1;
        if(p.y < 0 || p.y > canvas.height) p.speedY *= -1;
        
        ctx.globalAlpha = p.opacity;
        ctx.fillStyle = p.color;
        ctx.shadowColor = '#8b5cf6';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });
    
    // draw neural connections
    drawConnections();
    
    // reset shadow for performance
    ctx.shadowBlur = 0;
    requestAnimationFrame(animateParticles);
}
animateParticles();

// ---------- AUDIO CONTROL ----------
const playBtn = document.getElementById('playBtn');
const audio = document.getElementById('bgmusic');
let isPlaying = false;

playBtn.addEventListener('click', () => {
    if(isPlaying) {
        audio.pause();
        playBtn.innerHTML = "🎵 Play Cyber Beat";
        isPlaying = false;
    } else {
        audio.play().catch(() => {});
        playBtn.innerHTML = "⏸️ Pause Beat";
        isPlaying = true;
    }
});

// resize canvas
window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    // reposition particles to avoid clustering
    particles.forEach(p => {
        p.x = Math.random() * canvas.width;
        p.y = Math.random() * canvas.height;
    });
});
</script>
