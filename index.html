<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA-BXMD | WhatsApp Bot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }

        /* 1. GLITTER/PARTICLE CANVAS */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 2;
            padding: 40px;
            border: 1px solid #222;
            border-radius: 20px;
            background: rgba(17, 17, 17, 0.85);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.4);
            animation: float 3s ease-in-out infinite;
        }

        /* 2. GLOWING TEXT ANIMATION */
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #8b5cf6, #3b82f6, #ec4899);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 3s ease infinite, floatText 2s ease-in-out infinite;
        }
        
        @keyframes glow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes floatText { 0%, 100% { text-shadow: 0 0 10px rgba(139, 92, 246, 0.5); } 50% { text-shadow: 0 0 25px rgba(59, 130, 246, 0.8); } }

        p { color: #aaa; margin-bottom: 30px; }
        .links a { display: inline-block; margin: 10px; text-decoration: none; }
        .github-btn img { height: 40px; transition: transform 0.3s; }
        .github-btn img:hover { transform: scale(1.1); }

        /* AUDIO PLAYER */
        .audio-control {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 10px;
            background: #1a1a1a;
            cursor: pointer;
            transition: 0.3s;
        }
        .audio-control:hover { background: #2a2a2a; box-shadow: 0 0 15px rgba(139, 92, 246, 0.5); }
    </style>
</head>
<body>
    <canvas id="particles"></canvas>

    <div class="container">
        <h1>🔥 AURA-BXMD</h1>
        <p>Multi-Device WhatsApp Bot by <b>sir-bravin111</b></p>

        <div class="links" align="center">
            <strong>1. GITHUB REPO</strong>
            <br>
            <a href="https://github.com/sir-bravin111/AURA-BXMD" target="_blank" class="github-btn">
                <img src="https://img.shields.io/badge/GitHub-100000?style=for-the-badge&logo=github&logoColor=white&labelColor=black&color=black" alt="GitHub Repo"/>
            </a>
            <br><br>

            <strong>2. 𝔻𝔼ℙ𝕃𝕆𝕐 𝕋𝕆 ℍ𝔼ℝ𝕆𝕂𝕌</strong>
            <br>
            <a href="https://dashboard.heroku.com/new?template=https://github.com/sir-bravin111/AURA-BXMD#main" target="_blank">
                <img alt="Deploy to heroku" src="https://img.shields.io/badge/Deploy-100000?style=for-the-badge&logo=heroku&logoColor=white&labelColor=430098&color=430098"/>
            </a>
        </div>
        
        <!-- 3. AUDIO: ALAN WALKER - ALONE -->
        <div class="audio-control" onclick="document.getElementById('bgmusic').play()">
            🎵 Click to play: Alan Walker - Alone
        </div>
        <audio id="bgmusic" loop>
            <source src="https://cdn.pixabay.com/download/audio/2022/03/24/audio_d1716cc9a6.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>

        <p style="font-size: 12px; margin-top: 20px;">Click "Deploy to Heroku" and connect your WhatsApp with pairing code</p>
    </div>

<script>
// GLITTER EFFECT SCRIPT
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];
for(let i = 0; i < 100; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2 + 1,
        speedX: (Math.random() * 0.5 - 0.25),
        speedY: (Math.random() * 0.5 - 0.25),
        opacity: Math.random()
    });
}

function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = 'white';
    particles.forEach(p => {
        p.x += p.speedX;
        p.y += p.speedY;
        if(p.x < 0 || p.x > canvas.width) p.speedX *= -1;
        if(p.y < 0 || p.y > canvas.height) p.speedY *= -1;
        
        ctx.globalAlpha = p.opacity;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });
    requestAnimationFrame(animateParticles);
}
animateParticles();

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>
</body>
</html>
