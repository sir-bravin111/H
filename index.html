<head>
    <meta charset="UTF-8">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
            padding: 20px;
        }

        /* GLITTER/PARTICLE CANVAS */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 2;
            padding: 40px 35px;
            max-width: 700px;
            width: 100%;
            border: 1px solid #222;
            border-radius: 24px;
            background: rgba(17, 17, 17, 0.85);
            backdrop-filter: blur(12px);
            box-shadow: 0 0 50px rgba(139, 92, 246, 0.3);
            animation: float 3s ease-in-out infinite;
            transition: all 0.2s;
        }

        /* GLOWING TEXT ANIMATION */
        h1 {
            font-size: 2.8rem;
            margin-bottom: 6px;
            background: linear-gradient(90deg, #8b5cf6, #3b82f6, #ec4899);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 3s ease infinite, floatText 2s ease-in-out infinite;
        }
        
        @keyframes glow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes floatText { 0%, 100% { text-shadow: 0 0 10px rgba(139, 92, 246, 0.5); } 50% { text-shadow: 0 0 30px rgba(59, 130, 246, 0.8); } }

        .subhead {
            color: #bbb;
            margin-bottom: 24px;
            font-size: 1.05rem;
            letter-spacing: 1px;
        }
        .subhead b { color: #c084fc; }

        .links a { display: inline-block; margin: 10px; text-decoration: none; }
        .github-btn img { height: 40px; transition: transform 0.3s; }
        .github-btn img:hover { transform: scale(1.1); }

        /* BEAT PLAYER BUTTON */
        .audio-control {
            margin: 18px 0 12px;
            padding: 12px 28px;
            border: 1px solid #8b5cf6;
            border-radius: 50px;
            background: linear-gradient(90deg, #8b5cf6, #3b82f6);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: inline-block;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
        }
        .audio-control:hover { 
            transform: scale(1.05); 
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.7); 
        }

        /* NEW: CONDUCT ME / CONTACT SECTION */
        .contact-section {
            margin-top: 30px;
            padding-top: 24px;
            border-top: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .contact-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .contact-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #1e1e1e;
            padding: 12px 28px;
            border-radius: 60px;
            border: 1px solid #3b3b3b;
            color: #fff;
            font-weight: 600;
            text-decoration: none;
            transition: 0.2s;
            font-size: 1rem;
            letter-spacing: 0.5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);

        .contact-btn i { font-size: 1.4rem; line-height: 1; }
        .contact-btn.whatsapp { background: #075e54; border-color: #128C7E; }
        .contact-btn.whatsapp:hover { background: #128C7E; transform: scale(1.04); box-shadow: 0 0 20px #075e54aa; }
        .contact-btn.telegram { background: #1f2c3b; border-color: #2f7bb3; }
        .contact-btn.telegram:hover { background: #2f7bb3; transform: scale(1.04); box-shadow: 0 0 20px #2f7bb3aa; }
        .contact-btn.email { background: #2d2d2d; border-color: #6b6b6b; }
        .contact-btn.email:hover { background: #4a4a4a; transform: scale(1.04); box-shadow: 0 0 20px #88888866; }

        .conduct-badge {

            border: 1px solid #8b5cf655;
            border-radius: 60px;
            padding: 8px 22px;
            font-size: 0.9rem;

        }
        .conduct-badge span { color: #a78bfa; font-weight: 600; }

        .footnote {

        }

        @media (max-width: 550px) {

            h1 { font-size: 2.2rem; }
            .contact-row { flex-direction: column; gap: 12px; }
            .contact-btn { width: 100%; justify-content: center; }
        }
    </style>

<body>
    <canvas id="particles"></canvas>

    <div class="container">

        <div class="links">

<script>
// GLITTER EFFECT SCRIPT
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];
for(let i = 0; i < 120; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2 + 1,
        speedX: (Math.random() * 0.6 - 0.3),
        speedY: (Math.random() * 0.6 - 0.3),
        opacity: Math.random()
    });
}

function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
        p.x += p.speedX;
        p.y += p.speedY;
        if(p.x < 0 || p.x > canvas.width) p.speedX *= -1;
        if(p.y < 0 || p.y > canvas.height) p.speedY *= -1;
        
        ctx.globalAlpha = p.opacity;
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });
    requestAnimationFrame(animateParticles);
}
animateParticles();

// AUDIO PLAY/PAUSE ON CLICK
const playBtn = document.getElementById('playBtn');
const audio = document.getElementById('bgmusic');
let isPlaying = false;

playBtn.addEventListener('click', () => {
    if(isPlaying) {
        audio.pause();
        playBtn.innerHTML = "🎵 Play Cyber Beat";
        isPlaying = false;
    } else {
        audio.play();
        playBtn.innerHTML = "⏸️ Pause Beat";
        isPlaying = true;
    }
});

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>
